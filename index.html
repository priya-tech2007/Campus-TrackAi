<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusTrack AI — Academic Growth & Achievement Management</title>
    <meta name="description" content="AI-Based Student Academic Growth and Achievement Management System for college students and faculty." />
    <meta property="og:title" content="CampusTrack AI — Academic Growth & Achievement Management" />
    <meta property="og:description" content="AI-Based Student Academic Growth and Achievement Management System for college students and faculty." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('campustrack_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
